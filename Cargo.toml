[workspace]
members = [
    "cli",
    "crates/client-api",
    "crates/client-auth",
    "crates/client-core",
    "crates/client-crypto",
    "crates/client-runtime",
    "crates/strong-box",
    "crates/strong-box-wasm",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.1"
license = "GPL-3.0-only"

[workspace.dependencies]
anstyle = "1.0.14"
argon2 = "0.5.3"
base64 = "0.22.1"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
chrono = { version = "0.4.38", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
clap_mangen = "0.2"
dirs = "5.0"
flate2 = "1.1"
fs2 = "0.4.3"
generic-array = "0.14"
hkdf = "0.12.4"
hmac = "0.12.1"
html2md = "0.2.15"
hickory-resolver = { version = "0.26.1", features = ["tokio"] }
keyring = { version = "3.6.3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
opaque-ke = { version = "4.0.1", features = ["argon2", "ristretto255"] }
rand_core = { version = "0.6", features = ["std"] }
reqwest = { version = "0.12.4", default-features = false, features = ["brotli", "deflate", "gzip", "json", "rustls-tls"] }
rpassword = "7.5.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.145"
sha2 = "0.10.8"
shlex = "1.3.0"
socket2 = { version = "0.5.10", features = ["all"] }
strong-box = "0.5.1"
thiserror = "2.0.17"
tempfile = "3.14"
terminal_size = "0.4.3"
tokio = { version = "1.48.0", features = ["full"] }
undocx = "0.5.2"
unicode-normalization = "0.1.24"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.lints.clippy]
unwrap_used = "deny"
