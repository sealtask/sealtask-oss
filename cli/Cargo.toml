[package]
name = "sealtask"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for working with SealTask tasks, comments, and encrypted workspace data"
repository = "https://github.com/sealtask/sealtask-oss"
homepage = "https://sealtask.com"
readme = "../README.md"
keywords = ["sealtask", "cli", "tasks", "productivity", "agents"]
categories = ["command-line-utilities", "api-bindings"]
publish = ["crates-io"]

[dependencies]
