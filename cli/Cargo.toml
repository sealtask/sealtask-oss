reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

sealtask-client-api = { version = "0.2.1", path = "../crates/client-api" }
sealtask-client-auth = { version = "0.2.1", path = "../crates/client-auth" }
sealtask-client-core = { version = "0.2.1", path = "../crates/client-core" }
sealtask-client-crypto = { version = "0.2.1", path = "../crates/client-crypto" }
sealtask-client-runtime = { version = "0.2.1", path = "../crates/client-runtime" }

