[package]
name = "sealtask-client-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent-facing runtime and decrypted read models for SealTask clients"
repository = "https://github.com/worklistapp/worklist-oss"
homepage = "https://sealtask.com"
readme = "../../README.md"
keywords = ["sealtask", "runtime", "agents", "client"]
categories = ["api-bindings"]
publish = ["crates-io"]

[dependencies]
base64.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
chrono.workspace = true
html2md.workspace = true
hickory-resolver.workspace = true
rpassword.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2.workspace = true
tokio.workspace = true
undocx.workspace = true
uuid.workspace = true
zeroize.workspace = true
zip.workspace = true

sealtask-client-api = { version = "0.2.0", path = "../client-api" }
sealtask-client-auth = { version = "0.2.0", path = "../client-auth" }
sealtask-client-core = { version = "0.2.0", path = "../client-core" }
sealtask-client-crypto = { version = "0.2.0", path = "../client-crypto" }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
