[package]
name = "sealtask-client-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client-side crypto helpers for SealTask sealed payloads and key derivation"
repository = "https://github.com/sealtask/sealtask-oss"
homepage = "https://sealtask.com"
readme = "../../README.md"
keywords = ["sealtask", "crypto", "client", "encryption"]
categories = ["cryptography", "api-bindings"]
publish = ["crates-io"]

[dependencies]
argon2.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
hkdf.workspace = true
hmac.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
strong-box.workspace = true
uuid.workspace = true
zeroize.workspace = true

sealtask-client-core = { version = "=0.4.0", path = "../client-core" }

[dev-dependencies]
chacha20poly1305 = "0.10"
x25519-dalek.workspace = true
