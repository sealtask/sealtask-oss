name: Bootstrap crates.io ownership

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing public release tag to publish (for example v0.3.0)"
        required: true
        type: string
      confirmation:
        description: "Type BOOTSTRAP-SEALTASK-CRATES"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-publication
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    environment: crates-io-bootstrap

    steps:
      - name: Confirm one-time bootstrap
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "${CONFIRMATION}" != "BOOTSTRAP-SEALTASK-CRATES" ]]; then
            echo "::error::The confirmation value did not match."
            exit 1
          fi

      - name: Checkout the immutable public tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.0

      - name: Validate bootstrap tag provenance
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" != "v0.3.0" ]]; then
            echo "::error::The one-time ownership bootstrap is restricted to v0.3.0."
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]]; then
            echo "::error::Bootstrap tag ${RELEASE_TAG} must be annotated."
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "${tag_commit}" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Checkout HEAD does not match ${RELEASE_TAG}."
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "::error::Bootstrap tag ${RELEASE_TAG} is not reachable from public main."
            exit 1
          fi

      - name: Require immutable GitHub Releases
        env:
          IMMUTABLE_RELEASES_ENABLED: ${{ vars.IMMUTABLE_RELEASES_ENABLED }}
        run: |
          if [[ "${IMMUTABLE_RELEASES_ENABLED}" != "true" ]]; then
            echo "::error::Enable immutable releases, then set the repository variable IMMUTABLE_RELEASES_ENABLED=true."
            exit 1
          fi

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./scripts/check-release-metadata.sh release --tag "${RELEASE_TAG}"

      - name: Publish the initial crate versions
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "::error::Configure a short-lived CRATES_IO_BOOTSTRAP_TOKEN in the crates-io-bootstrap environment."
            exit 1
          fi
          ./scripts/publish-crates.sh

      - name: Require credential teardown
        run: |
          echo "::warning::Revoke the bootstrap token, delete CRATES_IO_BOOTSTRAP_TOKEN, and configure trusted publishers for all six crates before the next release."
