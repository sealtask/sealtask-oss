name: Release gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.100.0

      - name: Validate the release ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
              echo "::error::Release tag ${GITHUB_REF_NAME} must be annotated."
              exit 1
            fi
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release tag ${GITHUB_REF_NAME} is not reachable from public main."
              exit 1
            fi
            ./scripts/check-release-metadata.sh release --tag "${GITHUB_REF_NAME}"
          else
            ./scripts/check-release-metadata.sh workspace
          fi

      - name: Require immutable GitHub Releases
        if: github.ref_type == 'tag'
        env:
          IMMUTABLE_RELEASES_ENABLED: ${{ vars.IMMUTABLE_RELEASES_ENABLED }}
        run: |
          if [[ "${IMMUTABLE_RELEASES_ENABLED}" != "true" ]]; then
            echo "::error::Enable immutable releases, then set the repository variable IMMUTABLE_RELEASES_ENABLED=true."
            exit 1
          fi

      - name: Test release automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest scripts/test_check_release_metadata.py
          python3 -m unittest scripts/test_finalize_release_changelog.py
          python3 -m unittest scripts/test_prepare_initial_release.py
          python3 -m unittest scripts/test_strong_box_wasm_manifest.py
          ./scripts/install-release-plz.sh "${RUNNER_TEMP}/release-plz-bin"
          RELEASE_PLZ_BIN="${RUNNER_TEMP}/release-plz-bin/release-plz" \
            python3 -m unittest scripts/test_release_preparation.py
          ./scripts/test-publish-crates.sh
          ./scripts/test-verify-registry-package.sh
