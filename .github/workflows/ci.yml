name: OSS CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "43 4 * * 1"

permissions:
  contents: read

jobs:
  browser-crypto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install browser crypto dependencies
        run: bun install --frozen-lockfile

      - name: Check browser crypto package
        run: bun run check:crypto-web

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test browser crypto in secure Chromium
        run: bun run --cwd packages/crypto-web test:browser

  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit dependencies
        run: cargo audit --deny warnings --file Cargo.lock

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Verify generated CLI assets
        run: ./scripts/generate-cli-assets.sh check

      - name: Verify canonical StrongBox WASM artifact
        run: ./scripts/build-strong-box-wasm.sh verify

      - name: Test release automation
        run: |
          ./scripts/check-release-metadata.sh workspace
          python3 -m unittest scripts/test_check_release_metadata.py
          python3 -m unittest scripts/test_finalize_release_changelog.py
          python3 -m unittest scripts/test_prepare_initial_release.py
          ./scripts/test-release-plz-cargo.sh
          ./scripts/test-publish-crates.sh

      - name: Install pinned cargo-dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh |
            sh

      - name: Verify generated release workflow
        run: ./scripts/generate-release-workflow.sh check
