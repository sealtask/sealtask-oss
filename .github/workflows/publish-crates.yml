name: Publish crates.io packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish and verify crates.io
    runs-on: ubuntu-24.04
    environment: crates-io
    concurrency:
      group: crates-io-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.0

      - name: Validate release metadata
        run: ./scripts/check-release-metadata.sh release --tag "${GITHUB_REF_NAME}"

      - name: Authenticate to crates.io with OIDC
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the lockstep crate graph
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/publish-crates.sh

      - name: Install and verify the registry package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          install_root="$(mktemp -d)"
          trap 'rm -rf "${install_root}"' EXIT
          cargo install \
            sealtask \
            --version "=${version}" \
            --locked \
            --root "${install_root}"
          ./scripts/verify-registry-package.sh \
            "${install_root}/bin/sealtask" \
            "${version}"
